name: Daily campus job radar

on:
  workflow_dispatch:
  schedule:
    # GitHub 使用 UTC 时间；00:00 UTC 对应北京时间 08:00
    - cron: "0 0 * * *"

concurrency:
  group: campus-job-radar
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and browser
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium

      - name: Test
        run: pytest -q

      - name: Collect and build dashboard
        run: |
          python -m job_watcher run \
            --config config/sources.json \
            --db data/jobs.db \
            --reports reports \
            --site site

      - name: Validate outputs
        run: |
          test -s site/index.html
          test -s site/data.json
          test -s reports/latest.md
          test -s reports/jobs.csv
          node scripts/validate_site.mjs site/index.html
          python -c "import sqlite3; c=sqlite3.connect('data/jobs.db'); assert c.execute('pragma integrity_check').fetchone()[0]=='ok'"

      - name: Save history to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.db reports/latest.md reports/jobs.csv site
          git diff --cached --quiet || git commit -m "chore: update job radar [skip ci]"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: job-radar-diagnostics
          path: |
            reports
            site/data.json
            data/jobs.db
          if-no-files-found: ignore

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: collect

    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
