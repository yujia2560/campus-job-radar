[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-job-radar"
version = "0.1.0"
description = "A transparent campus-job watcher for official company career portals."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "playwright>=1.48,<2",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[project.scripts]
job-radar = "job_watcher.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
